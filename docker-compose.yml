# Runs both sample services with healthchecks and hardened runtime options.
#   docker compose up --build
services:
  node-express:
    build: ./node-express
    ports: ["3000:3000"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  python-fastapi:
    build: ./python-fastapi
    ports: ["8000:8000"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
